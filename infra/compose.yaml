services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: keiba_lab
      POSTGRES_USER: keiba
      POSTGRES_PASSWORD: keiba_local
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keiba -d keiba_lab"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
