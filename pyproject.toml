[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "keiba-lab"
version = "0.1.0"
description = "Deterministic horse-racing prediction and backtest platform skeleton"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "tzdata>=2024.1",
  "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
  "types-PyYAML>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = [
  "packages/domain/src/keiba_domain",
  "packages/application/src/keiba_application",
  "packages/infrastructure/src/keiba_infrastructure",
  "apps/api/src/keiba_api",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "packages/domain/src",
  "packages/application/src",
  "packages/infrastructure/src",
  "apps/api/src",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "apps", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages", "apps", "tests"]
mypy_path = [
  "packages/domain/src",
  "packages/application/src",
  "packages/infrastructure/src",
  "apps/api/src",
]
